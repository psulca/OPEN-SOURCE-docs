name: Docs CI

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make script executable
        run: chmod +x scripts/build-report.sh
      - name: Build concatenated MD
        run: ./scripts/build-report.sh
      - name: Upload concatenated MD (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: REPORT_TB1_md
          path: build/REPORT_TB1.md

  publish-pages:
    runs-on: ubuntu-latest
    needs: build-report
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
  
      # ↓ Trae el MD concatenado del job anterior
      - name: Download concatenated MD
        uses: actions/download-artifact@v4
        with:
          name: REPORT_TB1_md
          path: build
  
      # ↓ Si por X motivo no existe, lo construye de nuevo
      - name: Ensure REPORT_TB1.md exists
        run: |
          if [ ! -f build/REPORT_TB1.md ]; then
            chmod +x scripts/build-report.sh
            ./scripts/build-report.sh
          fi
          ls -la build
  
      - name: Install pandoc + LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          sudo apt-get install -y texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
  
      - name: Build site (HTML + PDF)
        run: |
          mkdir -p build/site
          pandoc -s --toc \
            -V toc-title:"Tabla de contenidos" \
            -V geometry:margin=2.5cm \
            -o build/site/index.html build/REPORT_TB1.md
          pandoc -s --toc \
            -V geometry:margin=2.5cm \
            -o build/site/REPORT_TB1.pdf build/REPORT_TB1.md
            
      - name: Add download button to HTML
        run: |
          echo '<a href="REPORT_TB1.pdf" download
          style="position: fixed; top: 20px; right: 20px; background: #007bff; color: white;
                 padding: 10px 15px; border-radius: 5px; text-decoration: none; font-family: sans-serif;
                 box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 1000;">
            📄 Descargar PDF
          </a>' >> build/site/index.html
  
      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
