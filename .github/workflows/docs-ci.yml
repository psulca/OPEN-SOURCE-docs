name: Docs CI

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make script executable
        run: chmod +x scripts/build-report.sh
      - name: Build concatenated MD
        run: ./scripts/build-report.sh
      - name: Upload concatenated MD (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: REPORT_TB1_md
          path: build/REPORT_TB1.md

  publish-pages:
    runs-on: ubuntu-latest
    needs: build-report
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc + LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          sudo apt-get install -y texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
      - name: Build site (HTML + PDF)
        run: |
          mkdir -p build/site
          pandoc -s --toc --number-sections \
            -V toc-title:"Tabla de contenidos" \
            -V geometry:margin=2.5cm \
            -o build/site/index.html build/REPORT_TB1.md
          pandoc -s --toc --number-sections \
            -V geometry:margin=2.5cm \
            -o build/site/REPORT_TB1.pdf build/REPORT_TB1.md
      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
